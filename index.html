<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Чат унікальних слів</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
    background: #eef1f6;
    color: #1c2333;
    height: 100vh;
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 640px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: #ffffff;
    box-shadow: 0 0 24px rgba(0,0,0,0.08);
  }
  header {
    padding: 16px 20px;
    background: #2f6fed;
    color: #fff;
    flex-shrink: 0;
  }
  header h1 {
    margin: 0 0 8px;
    font-size: 18px;
  }
  .counter {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(255,255,255,0.18);
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 14px;
  }
  .counter b { font-size: 16px; }
  .status {
    font-size: 12px;
    margin-left: 10px;
    opacity: 0.85;
  }
  .chat {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .empty {
    margin: auto;
    color: #98a2b3;
    text-align: center;
    font-size: 14px;
  }
  .msg {
    max-width: 85%;
    padding: 10px 14px;
    border-radius: 14px;
    background: #f1f4f9;
    align-self: flex-start;
    word-wrap: break-word;
  }
  .msg .sender {
    font-size: 12px;
    font-weight: 700;
    color: #2f6fed;
    margin-bottom: 4px;
  }
  .msg .text { font-size: 15px; line-height: 1.4; }
  form {
    flex-shrink: 0;
    border-top: 1px solid #e4e8ef;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: #fafbfd;
  }
  .row { display: flex; gap: 8px; }
  input, textarea {
    font-family: inherit;
    font-size: 15px;
    border: 1px solid #d0d7e2;
    border-radius: 10px;
    padding: 10px 12px;
    outline: none;
    resize: none;
  }
  input:focus, textarea:focus { border-color: #2f6fed; }
  #sender { flex: 1; }
  #text { flex: 1; min-height: 44px; }
  button {
    background: #2f6fed;
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 0 20px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: #245bd0; }
  button:disabled { background: #9db8ef; cursor: not-allowed; }
  .error {
    color: #d92d20;
    font-size: 13px;
    min-height: 18px;
  }
  .clear-btn {
    background: transparent;
    color: rgba(255,255,255,0.85);
    border: 1px solid rgba(255,255,255,0.4);
    padding: 4px 10px;
    font-size: 12px;
    border-radius: 16px;
    float: right;
    margin-top: -34px;
  }
  .clear-btn:hover { background: rgba(255,255,255,0.15); }

  /* Модальне вікно підтвердження */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15,23,42,0.5);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: #fff;
    border-radius: 14px;
    padding: 22px;
    max-width: 360px;
    width: 100%;
    box-shadow: 0 12px 40px rgba(0,0,0,0.25);
    text-align: center;
  }
  .modal h2 { margin: 0 0 8px; font-size: 18px; }
  .modal p { margin: 0 0 20px; color: #475467; font-size: 14px; }
  .modal .actions { display: flex; gap: 10px; }
  .modal .actions button { flex: 1; padding: 10px 0; }
  .btn-cancel { background: #eef1f6; color: #1c2333; }
  .btn-cancel:hover { background: #e2e7f0; }
  .btn-danger { background: #d92d20; }
  .btn-danger:hover { background: #b42318; }
</style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Чат унікальних слів</h1>
      <span class="counter">Унікальних слів: <b id="wordCount">0</b></span>
      <span class="status" id="status">зʼєднання…</span>
      <button type="button" class="clear-btn" id="clearBtn">Очистити</button>
    </header>

    <div class="chat" id="chat">
      <div class="empty" id="emptyState">Повідомлень ще немає. Напишіть перше.</div>
    </div>

    <form id="form">
      <div class="error" id="error"></div>
      <div class="row">
        <input id="sender" type="text" placeholder="Ваше імʼя" autocomplete="off">
      </div>
      <div class="row">
        <textarea id="text" placeholder="Введіть повідомлення (тільки українські слова)"></textarea>
        <button type="submit" id="sendBtn" disabled>Надіслати</button>
      </div>
    </form>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h2>Обнулити чат?</h2>
      <p>Ви впевнені? Уся історія повідомлень і список унікальних слів будуть видалені для всіх користувачів без можливості відновлення.</p>
      <div class="actions">
        <button type="button" class="btn-cancel" id="modalCancel">Скасувати</button>
        <button type="button" class="btn-danger" id="modalConfirm">Так, обнулити</button>
      </div>
    </div>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getDatabase, ref, push, onValue, remove
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  // --- Конфігурація Firebase ---
  // databaseURL відповідає вашій базі в регіоні europe-west1.
  const firebaseConfig = {
    apiKey: "AIzaSyANV-CJaENzFF0fTxjtvL9XmBW6OtyoGVU",
    authDomain: "chat-4decc.firebaseapp.com",
    databaseURL: "https://chat-4decc-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "chat-4decc",
    storageBucket: "chat-4decc.firebasestorage.app",
    messagingSenderId: "484099038630",
    appId: "1:484099038630:web:fcbe708d81bf52fb04c367"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const messagesRef = ref(db, "messages");

  // --- Елементи DOM ---
  const chatEl = document.getElementById("chat");
  const emptyState = document.getElementById("emptyState");
  const form = document.getElementById("form");
  const senderInput = document.getElementById("sender");
  const textInput = document.getElementById("text");
  const errorEl = document.getElementById("error");
  const wordCountEl = document.getElementById("wordCount");
  const clearBtn = document.getElementById("clearBtn");
  const sendBtn = document.getElementById("sendBtn");
  const statusEl = document.getElementById("status");
  const modalOverlay = document.getElementById("modalOverlay");
  const modalCancel = document.getElementById("modalCancel");
  const modalConfirm = document.getElementById("modalConfirm");

  // Дозволені розділові знаки: крапка, кома, тире, двокрапка.
  const FORBIDDEN_CHAR = /[a-z0-9]/i;                 // англійські букви та цифри
  const ALLOWED_PUNCT = ".,\u2013\u2014-:";           // . , – — - :

  // Локальний кеш спільного стану, який приходить з Firebase.
  let messages = [];             // [{ sender, text, ts }]
  let usedWords = new Set();     // усі унікальні слова з усіх повідомлень

  // --- Підписка на спільну історію в реальному часі ---
  // onValue спрацьовує щоразу, коли дані у Firebase змінюються (на будь-якому пристрої).
  onValue(messagesRef, (snapshot) => {
    const data = snapshot.val() || {};
    messages = Object.keys(data)
      .map((key) => ({ key, ...data[key] }))
      .sort((a, b) => (a.ts || 0) - (b.ts || 0));

    // Перебудовуємо множину використаних слів зі спільної історії.
    usedWords = new Set();
    messages.forEach((m) => {
      extractWords(m.text).forEach((w) => usedWords.add(w));
    });

    render();
    setStatus("онлайн", false);
    sendBtn.disabled = false;
  }, (err) => {
    setStatus("помилка зʼєднання", true);
    showError("Не вдалося підключитися до бази: " + err.message);
  });

  // --- Відправка повідомлення ---
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    clearError();

    const sender = senderInput.value.trim();
    const text = textInput.value.trim();

    if (!sender) { return showError("Вкажіть імʼя відправника."); }
    if (!text) { return showError("Повідомлення порожнє."); }

    // 1. Заборонені символи: англійські букви / цифри.
    if (FORBIDDEN_CHAR.test(text)) {
      return showError("Заборонено використовувати англійські букви та цифри.");
    }

    // 2. Заборонені розділові знаки (дозволені лише . , - :).
    const badPunct = findForbiddenPunctuation(text);
    if (badPunct) {
      return showError("Заборонений символ: «" + badPunct + "». Дозволені лише . , - :");
    }

    // 3. Унікальність слів проти спільної історії.
    const words = extractWords(text);
    if (words.length === 0) {
      return showError("Повідомлення має містити хоча б одне слово.");
    }

    const seenInMsg = new Set();
    for (const w of words) {
      if (usedWords.has(w) || seenInMsg.has(w)) {
        return showError("Слово «" + w + "» вже було використане в чаті.");
      }
      seenInMsg.add(w);
    }

    // Записуємо у спільну базу. onValue сам оновить UI на всіх пристроях.
    sendBtn.disabled = true;
    try {
      await push(messagesRef, { sender, text, ts: Date.now() });
      textInput.value = "";
      textInput.focus();
    } catch (err) {
      showError("Не вдалося надіслати: " + err.message);
    } finally {
      sendBtn.disabled = false;
    }
  });

  // --- Обнулення спільного чату ---
  clearBtn.addEventListener("click", () => modalOverlay.classList.add("show"));
  modalCancel.addEventListener("click", closeModal);
  modalOverlay.addEventListener("click", (e) => {
    if (e.target === modalOverlay) { closeModal(); }
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { closeModal(); }
  });
  modalConfirm.addEventListener("click", async () => {
    try {
      await remove(messagesRef);   // видаляє всю історію у спільній базі
      clearError();
    } catch (err) {
      showError("Не вдалося обнулити: " + err.message);
    }
    closeModal();
  });

  function closeModal() {
    modalOverlay.classList.remove("show");
  }

  // --- Допоміжні функції ---

  // Розбиває текст на слова без урахування регістру та розділових знаків.
  function extractWords(text) {
    const cleaned = text.toLowerCase().replace(/[^\p{L}]+/gu, " ");
    return cleaned.split(/\s+/).filter(Boolean);
  }

  // Повертає перший заборонений розділовий знак або null.
  function findForbiddenPunctuation(text) {
    for (const ch of text) {
      if (/\p{L}/u.test(ch) || /\s/.test(ch)) { continue; }
      if (ALLOWED_PUNCT.indexOf(ch) !== -1) { continue; }
      return ch;
    }
    return null;
  }

  function render() {
    chatEl.innerHTML = "";
    if (messages.length === 0) {
      chatEl.appendChild(emptyState);
    } else {
      messages.forEach((m) => {
        const wrap = document.createElement("div");
        wrap.className = "msg";

        const s = document.createElement("div");
        s.className = "sender";
        s.textContent = m.sender;

        const t = document.createElement("div");
        t.className = "text";
        t.textContent = m.text;

        wrap.appendChild(s);
        wrap.appendChild(t);
        chatEl.appendChild(wrap);
      });
      chatEl.scrollTop = chatEl.scrollHeight;
    }
    wordCountEl.textContent = usedWords.size;
  }

  function showError(msg) { errorEl.textContent = msg; }
  function clearError() { errorEl.textContent = ""; }
  function setStatus(text, isError) {
    statusEl.textContent = text;
    statusEl.style.color = isError ? "#ffd6d6" : "";
  }
</script>
</body>
</html>
